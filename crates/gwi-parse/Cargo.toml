[package]
name = "gwi-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Git With It — tree-sitter symbol extraction (TS/JS + Python)"

[[bin]]
name = "gwi-parse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "~4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.24"
tree-sitter-python = "0.23.6"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.14"

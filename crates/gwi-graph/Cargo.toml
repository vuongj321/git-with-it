[package]
name = "gwi-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Git With It — package/file graph builder (Neo4j / PG payloads)"

[[bin]]
name = "gwi-graph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "~4.5.23", features = ["derive"] }
gwi-link = { path = "../gwi-link" }
gwi-parse = { path = "../gwi-parse" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

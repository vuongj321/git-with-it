[package]
name = "gwi-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Git With It — architectural metrics from graph snapshots"

[[bin]]
name = "gwi-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "~4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

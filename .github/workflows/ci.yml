name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @gwi/shared-types build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build packages & apps
        run: pnpm build

      - name: Build Rust crates
        run: cargo build --workspace --release

      - name: Test Rust crates (incl. golden fixtures)
        run: cargo test --workspace

  docker-images:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t gwi-api:ci .
        continue-on-error: true
      - name: Build worker image
        run: docker build -f apps/worker-ts/Dockerfile -t gwi-worker:ci .
        continue-on-error: true
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t gwi-web:ci .
        continue-on-error: true
